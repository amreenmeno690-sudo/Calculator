
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Suite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1313ec",
                        "background-light": "#f6f6f8",
                        "background-dark": "#101022",
                        "surface-dark": "#1c1c27",
                        "card-dark": "#1e1e24",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-button {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        .glass-button:active {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(0.92);
        }

        .glass-button-primary {
            background: #1313ec;
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 24px rgba(19, 19, 236, 0.3);
        }

        .glow-bg {
            background: radial-gradient(circle at 50% 30%, rgba(19, 19, 236, 0.15) 0%, rgba(16, 16, 34, 0) 70%);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes laserScan {
            0% { top: 0%; opacity: 0.1; }
            50% { top: 100%; opacity: 0.8; }
            100% { top: 0%; opacity: 0.1; }
        }
        .laser-line {
            height: 2px;
            background: linear-gradient(90deg, transparent, #1313ec, transparent);
            box-shadow: 0 0 15px #1313ec;
            animation: laserScan 2.5s infinite linear;
        }

        @keyframes confettiPop {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-confetti {
            animation: confettiPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .screen-transition-enter { opacity: 0; transform: scale(0.98); }
        .screen-transition-enter-active { opacity: 1; transform: scale(1); transition: all 0.4s ease-out; }
    </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0"
  }
}
</script>
</head>
<body class="bg-background-dark text-white font-display overflow-hidden select-none">
    <div id="root"></div>
</body>
</html>
